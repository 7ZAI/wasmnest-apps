[package]
name = "wasmnest-plugin-agent-hub"
version = "0.0.1"
license = "MIT"
description = "Agent Hub Plugin — Agent CLI 统一管理台"
authors = ["WasmNest"]
edition = "2021"

[features]
default = ["native"]
native = []
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api = { version = "=0.0.1", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
