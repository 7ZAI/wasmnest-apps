[package]
name = "bedcode_plugin_terminal_session"
version = "0.0.1"
license = "MIT"
description = "WasmNest Plugin (Mobile, remote-terminal-consumer)"
authors = ["WasmNest"]
edition = "2021"

[features]
default = []
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api-mobile = { path = "../../../../../wasmnest/wasmnest-mobile/packages/plugin-sdk-mobile/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
