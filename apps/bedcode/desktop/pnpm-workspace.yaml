# 独立工程声明为最小 pnpm workspace：使 `pnpm install` 锚定本目录（不被上层/相邻
# workspace 吸附），并按需放行依赖构建脚本。pnpm 12 用 allowBuilds 白名单
# （旧 onlyBuiltDependencies 已改名）；esbuild 为 vite/tsup 原生二进制所需。
packages:
  - .
allowBuilds:
  esbuild: true
  # vue-demi：vue-echarts / vue-i18n 等运行时切换 Vue 指向所需
  vue-demi: true
minimumReleaseAgeExclude:
  - '@binblink/wasmnest-plugin-sdk-desktop@0.0.1'
