[package]
name = "wasmnest-plugin-notenote"
version = "0.0.1"
license = "MIT"
description = "WasmNest — lightweight Markdown note-taking app (wasip3)"
authors = ["WasmNest"]
edition = "2021"

[features]
default = ["native"]
native = []
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api = { path = "../../../../../wasmnest/wasmnest-desktop/packages/plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
