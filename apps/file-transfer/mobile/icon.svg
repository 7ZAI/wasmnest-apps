<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 暖墨底 + 纸白设备 + 雾青传输箭头（与移动端 .ft-app 主题 token 同源） -->
  <rect width="100" height="100" rx="20" fill="#1D1A15"/>
  <!-- 本地设备 -->
  <rect x="16" y="26" width="24" height="48" rx="4" fill="#ECE8DC"/>
  <circle cx="28" cy="66" r="2.5" fill="#1D1A15"/>
  <!-- 远程对端设备 -->
  <rect x="60" y="26" width="24" height="48" rx="4" fill="#ECE8DC"/>
  <circle cx="72" cy="66" r="2.5" fill="#1D1A15"/>
  <!-- 上传箭头（左→右） -->
  <path d="M42 38 L52 38" stroke="#8FC0C6" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M48 32 L52 38 L48 44" stroke="#8FC0C6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 下载箭头（右→左） -->
  <path d="M58 58 L48 58" stroke="#8FC0C6" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M52 52 L48 58 L52 64" stroke="#8FC0C6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
