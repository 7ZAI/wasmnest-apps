[package]
name = "wasmnest-plugin-file-transfer"
version = "0.0.1"
license = "MIT"
description = "File Transfer Plugin — 内网文件传输"
authors = ["WasmNest"]
edition = "2021"

[features]
default = ["native"]
native = []
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api = { path = "../../../../../wasmnest/wasmnest-desktop/packages/plugin-sdk-desktop/rust", features = ["wasm"] }
# 双端共享业务核（ADR 0044）：可共享面收敛为一份，双端差异面全部经端口 trait 注入
wasmnest-file-transfer-core = { path = "../../rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
