[package]
name = "wasmnest-plugin-ai-chatbox"
version = "0.0.1"
license = "MIT"
description = "AI Chatbox Plugin — AI chat with JSONL conversation logs"
authors = ["WasmNest"]
edition = "2021"

[features]
default = ["wasm"]
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api = { path = "../../../../../wasmnest/wasmnest-desktop/packages/plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
