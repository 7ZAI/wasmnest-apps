[package]
name = "wasmnest-news-core"
version = "0.0.1"
license = "MIT"
description = "News 双端共享业务核：领域类型、抓取解析、去重、窗口与排序、端口 trait"
authors = ["WasmNest"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# RSS / Atom 解析：纯 Rust、无 std 之外的原语，wasm32 目标可直接构建
quick-xml = "0.37"

# 标题指纹与条目 id 的稳定摘要
sha2 = "0.10"
unicode-normalization = "0.1"

# 正文抽取：拉取式 HTML token 流，自建轻量 DOM；纯 Rust、可进 wasm
htmlparser = "0.2"
[dev-dependencies]
# native 测试用真实 SQLite 验证迁移 / 统计 / 联动删除；bundled 不依赖系统库，wasm 构建不引入
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
