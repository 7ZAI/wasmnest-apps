# 双端同构 wasm 产物源（ADR 0050 单产物）：本 crate 不属于 desktop / mobile
# 任何一端，与共享核 `../core` 同住应用级 rust 层。桌面构建链
# `desktop/scripts/build.js` 与移动端 `package.json` 的 `wasmnest.sharedRustManifest`
# 都指向本文件。
[package]
name = "wasmnest-plugin-news"
version = "0.0.1"
license = "MIT"
description = "News Plugin — 个人新闻聚合"
authors = ["WasmNest"]
edition = "2021"

[features]
default = ["native"]
native = []
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api = { path = "../../../../../wasmnest/wasmnest-desktop/packages/plugin-sdk-desktop/rust", features = ["wasm"] }
wasmnest-news-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"