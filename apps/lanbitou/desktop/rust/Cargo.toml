[package]
name = "wasmnest-plugin-lanbitou"
version = "0.0.1"
license = "MIT"
description = "Lanbitou Plugin — Lightweight Markdown notepad"
authors = ["WasmNest"]
edition = "2021"

[features]
default = ["wasm"]
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api = { path = "../../../../../wasmnest/wasmnest-desktop/packages/plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
