[package]
name = "wasmnest-plugin-monitor"
version = "0.0.1"
license = "MIT"
description = "Monitor Plugin — read-only runtime metrics snapshot for loaded wasm apps"
authors = ["WasmNest"]
edition = "2021"

[features]
default = ["wasm"]
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api = { path = "../../../../../wasmnest/wasmnest-desktop/packages/plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
