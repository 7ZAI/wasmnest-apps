[package]
name = "wasmnest-plugin-speech"
version = "0.0.1"
license = "MIT"
description = "Speech service — 本地 host-stt + 远端 OpenAI 兼容供应商的语音识别服务"
authors = ["WasmNest"]
edition = "2021"

[features]
default = ["wasm"]
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api = { path = "../../../../../wasmnest/wasmnest-desktop/packages/plugin-sdk-desktop/rust", features = ["wasm"] }
wasmnest-speech-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"