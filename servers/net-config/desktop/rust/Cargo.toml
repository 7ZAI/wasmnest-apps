[package]
name = "wasmnest-plugin-net-config"
version = "0.0.1"
license = "MIT"
description = "Network Config — the single cross-app source of relay addressing and WAN policy (wasip3 service plugin)"
authors = ["WasmNest"]
edition = "2021"

[features]
# `wasm` 只是构建脚本的显式旗标（build.js / package.json 传
# `--no-default-features --features wasm`）；源码的实际门控是
# `cfg(target_arch = "wasm32")`，cargo test 走 default。native 测试不展开
# `#[plugin_api]` 宏、不产 wasm 产物——那是目标分流，不是 feature 分流。
default = ["wasm"]
wasm = []

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmnest-plugin-api = { path = "../../../../../wasmnest/wasmnest-desktop/packages/plugin-sdk-desktop/rust", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
